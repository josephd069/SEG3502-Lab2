<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Calculator</title>
    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        background: #f1f3f5;
        font-family: Arial, sans-serif;
    }

    .calculator {
        width: 294px;
        max-width: 100%;
        padding: 18px;
        background: #222629;
        border-radius: 14px;
        box-shadow: 0 12px 24px #00000040;
    }

    h1 {
        margin: 0 0 14px;
        color: #ffffff;
        text-align: center;
        font-size: 22px;
    }

    .screen {
        margin-bottom: 14px;
        padding: 12px;
        background: #101419;
        border-radius: 8px;
        text-align: right;
    }

    .expression {
        color: #aeb6bf;
        font-size: 12px;
        overflow-wrap: anywhere;
    }

    .expression:empty {
        display: none;
    }

    #display {
        display: block;
        color: #ffffff;
        font-size: 26px;
        overflow-wrap: anywhere;
    }

    .keys {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(5, 44px);
        gap: 8px;
    }

    button {
        padding: 0;
        border: none;
        border-radius: 8px;
        background: #e5e7eb;
        color: #222629;
        font-size: 20px;
        font-weight: bold;
        cursor: pointer;
    }

    button:hover {
        filter: brightness(0.92);
    }

    button:focus-visible {
        outline: 3px solid #ffffff;
        outline-offset: 2px;
    }

    .utility {
        background: #bbc1c7;
    }

    .operation,
    .equals {
        background: #f5b454;
        color: #ffffff;
    }

    .equals {
        grid-column: 4;
        grid-row: 4 / span 2;
    }

    .zero {
        grid-column: span 2;
    }

    .error {
        margin: 12px 0 0;
        color: #fecaca;
        text-align: center;
        font-size: 13px;
    }

    .error:empty {
        display: none;
    }
    </style>
</head>
<body>
    <main class="calculator">
        <h1>Calculator</h1>

        <div class="screen">
            <div id="expression" class="expression"></div>
            <output id="display"
                    aria-live="polite"
                    th:text="${result != '' ? result : '0'}">0</output>
        </div>

        <form id="calculatorForm" th:action="@{/calculate}" method="get">
            <input type="hidden" id="firstNumber" name="firstNumber"
                   th:value="${firstNumber}">
            <input type="hidden" id="secondNumber" name="secondNumber"
                   th:value="${secondNumber}">
            <input type="hidden" id="operation" name="operation">

            <div class="keys">
                <button type="button" class="utility" id="clear">C</button>
                <button type="button" class="utility" id="backspace"
                        aria-label="Delete last digit">⌫</button>
                <button type="button" class="operation"
                        data-operation="/" aria-label="Divide">÷</button>
                <button type="button" class="operation"
                        data-operation="*" aria-label="Multiply">×</button>

                <button type="button" data-digit="7">7</button>
                <button type="button" data-digit="8">8</button>
                <button type="button" data-digit="9">9</button>
                <button type="button" class="operation"
                        data-operation="-" aria-label="Subtract">−</button>

                <button type="button" data-digit="4">4</button>
                <button type="button" data-digit="5">5</button>
                <button type="button" data-digit="6">6</button>
                <button type="button" class="operation"
                        data-operation="+" aria-label="Add">+</button>

                <button type="button" data-digit="1">1</button>
                <button type="button" data-digit="2">2</button>
                <button type="button" data-digit="3">3</button>
                <button type="submit" class="equals">=</button>

                <button type="button" class="zero" data-digit="0">0</button>
                <button type="button" id="decimal">.</button>
            </div>
        </form>

        <div class="error" id="error" role="alert" th:switch="${error}">
            <span th:case="'NumberFormatError'">Please enter valid numbers.</span>
            <span th:case="'OperationFormatError'">Please select a valid operation.</span>
            <span th:case="'DivisionByZeroError'">Cannot divide by zero.</span>
        </div>
    </main>

    <script>
        const display = document.getElementById("display");
        const expression = document.getElementById("expression");
        const form = document.getElementById("calculatorForm");
        const firstInput = document.getElementById("firstNumber");
        const secondInput = document.getElementById("secondNumber");
        const operationInput = document.getElementById("operation");
        const error = document.getElementById("error");

        const symbols = {
            "+": "+",
            "-": "−",
            "*": "×",
            "/": "÷"
        };

        let current = display.textContent.trim() || "0";
        let first = "";
        let operation = "";
        let waitingForSecond = false;
        let freshResult = firstInput.value !== "";

        function updateDisplay() {
            display.textContent = current;
            expression.textContent = operation
                ? `${first} ${symbols[operation]}`
                : "";
        }

        function prepareEntry() {
            error.textContent = "";

            if (waitingForSecond || freshResult) {
                current = "0";
                waitingForSecond = false;
                freshResult = false;
            }
        }

        document.querySelectorAll("[data-digit]").forEach(button => {
            button.addEventListener("click", () => {
                prepareEntry();
                const digit = button.dataset.digit;
                current = current === "0" ? digit : current + digit;
                updateDisplay();
            });
        });

        document.getElementById("decimal").addEventListener("click", () => {
            prepareEntry();

            if (!current.includes(".")) {
                current += ".";
            }

            updateDisplay();
        });

        document.querySelectorAll("[data-operation]").forEach(button => {
            button.addEventListener("click", () => {
                error.textContent = "";

                if (operation && !waitingForSecond) {
                    error.textContent = "Press = before choosing another operation.";
                    return;
                }

                if (!operation) {
                    first = current;
                }

                operation = button.dataset.operation;
                waitingForSecond = true;
                freshResult = false;
                updateDisplay();
            });
        });

        document.getElementById("clear").addEventListener("click", () => {
            current = "0";
            first = "";
            operation = "";
            waitingForSecond = false;
            freshResult = false;
            firstInput.value = "";
            secondInput.value = "";
            operationInput.value = "";
            error.textContent = "";
            updateDisplay();
        });

        document.getElementById("backspace").addEventListener("click", () => {
            prepareEntry();
            current = current.slice(0, -1);

            if (current === "" || current === "-") {
                current = "0";
            }

            updateDisplay();
        });

        form.addEventListener("submit", event => {
            if (!operation || waitingForSecond) {
                event.preventDefault();
                error.textContent = "Enter two numbers and choose an operation.";
                return;
            }

            if (
                first.trim() === "" ||
                current.trim() === "" ||
                !Number.isFinite(Number(first)) ||
                !Number.isFinite(Number(current))
            ) {
                event.preventDefault();
                error.textContent = "Please enter valid numbers.";
                return;
            }

            firstInput.value = first;
            secondInput.value = current;
            operationInput.value = operation;
        });

        if (freshResult) {
            const previousOperation = new URLSearchParams(location.search)
                .get("operation");

            if (symbols[previousOperation]) {
                expression.textContent =
                    `${firstInput.value} ${symbols[previousOperation]} ${secondInput.value} =`;
            }
        }
    </script>
</body>
</html>
