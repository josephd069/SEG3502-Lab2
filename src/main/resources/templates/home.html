<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Basic Calculator</title>
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div>
        <h1>Basic Calculator</h1>

        <div th:switch="${error}">
            <p th:case="'NumberFormatError'">
                Please enter valid numbers.
            </p>

            <p th:case="'OperationFormatError'">
                Please select a valid operation.
            </p>

            <p th:case="'DivisionByZeroError'">
                Cannot divide by zero.
            </p>
        </div>

        <form th:action="@{/calculate}" method="get">
            <table>

                <tr>
                    <td>
                        <label for="firstNumber">First Number:</label>
                    </td>

                    <td>
                        <input name="firstNumber" id="firstNumber" th:value="${firstNumber}">
                    </td>
                </tr>

                <tr>
                    <td>
                        <label for="secondNumber">Second Number:</label>
                    </td>

                    <td>
                        <input name="secondNumber" id="secondNumber" th:value="${secondNumber}">
                    </td>
                </tr>

                <tr>
                    <td colspan="2">
                        <button type="submit" name="operation" value="+">+</button>
                        <button type="submit" name="operation" value="-">-</button>
                        <button type="submit" name="operation" value="*">*</button>
                        <button type="submit" name="operation" value="/">/</button>
                    </td>
                </tr>

                <tr>
                    <td>
                        <label>Result:</label>
                    </td>

                    <td>
                        <span th:text="${result}"></span>
                    </td>
                </tr>

            </table>
        </form>

    </div>
</body>

</html>
